<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --vp-green: #526B48;
  --vp-green-dark: #3B4F33;
  --vp-green-deep: #1E281A;
  --vp-green-soft: #EEF3EC;
  --vp-beige: #F0E8D8;
  --vp-beige-dark: #DFD4BF;
  --vp-terracotta: #B87950;
  --vp-terracotta-dark: #9B613B;
  --vp-terracotta-soft: #F9F0E9;
  --vp-cream: #FAF8F3;
  --vp-white: #FFFFFF;
  --vp-text: #1B2119;
  --vp-text-secondary: #4D564A;
  --vp-muted: #6C7569;
  --vp-border: #E5DFD2;
  --vp-border-strong: #D1C8B7;
  --vp-danger: #B93829;
  --vp-success: #256B3B;
  --vp-radius: 8px;
  --vp-radius-lg: 12px;
  --vp-shadow-xs: 0 1px 2px rgba(27, 33, 25, 0.05);
  --vp-shadow-sm: 0 4px 12px rgba(27, 33, 25, 0.06);
  --vp-shadow-md: 0 12px 28px -6px rgba(27, 33, 25, 0.08);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

body {
  background-color: var(--vp-cream);
  color: var(--vp-text);
  font-family: 'Inter', 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

html[dir="rtl"] body {
  font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
  direction: rtl;
  text-align: right;
}

a {
  color: inherit;
  text-decoration: none;
  transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

.container {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

/* ==========================================================================
   HEADER PROFESSIONNEL PLEINE LARGEUR (Style Grande Plateforme)
   ========================================================================== */
.site-header {
  background-color: var(--vp-white);
  border-bottom: 1px solid var(--vp-border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.navbar-pro {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 74px;
  gap: 1.5rem;
}

.brand-link {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  flex-shrink: 0;
}

.brand-logo {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--vp-border-strong);
}

.brand-name {
  font-size: 1.18rem;
  font-weight: 700;
  color: var(--vp-green-deep);
  letter-spacing: 0.8px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  list-style: none;
  height: 100%;
}

.nav-links li {
  height: 100%;
  display: flex;
  align-items: center;
}

.nav-link {
  display: inline-flex;
  align-items: center;
  height: 100%;
  padding: 0 0.9rem;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--vp-text-secondary);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}

.nav-link:hover {
  color: var(--vp-green-deep);
}

.nav-link.active {
  color: var(--vp-green);
  font-weight: 600;
  border-bottom-color: var(--vp-green);
}

.nav-utility {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  flex-shrink: 0;
}

.utility-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.48rem 0.85rem;
  border-radius: var(--vp-radius);
  font-size: 0.86rem;
  font-weight: 600;
  color: var(--vp-text);
  border: 1px solid var(--vp-border);
  background-color: var(--vp-white);
  white-space: nowrap;
}

.utility-link:hover {
  background-color: var(--vp-cream);
  border-color: var(--vp-border-strong);
}

.utility-link.admin-link {
  background-color: var(--vp-green-deep);
  color: var(--vp-white);
  border-color: var(--vp-green-deep);
}

.utility-link.admin-link:hover {
  background-color: var(--vp-green);
  border-color: var(--vp-green);
}

.lang-segmented {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--vp-border);
  border-radius: var(--vp-radius);
  overflow: hidden;
  background-color: var(--vp-cream);
}

.lang-segmented a {
  padding: 0.42rem 0.65rem;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--vp-muted);
}

.lang-segmented a.active-lang {
  background-color: var(--vp-green);
  color: var(--vp-white);
}

.notif-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background-color: var(--vp-terracotta);
  color: var(--vp-white);
  font-size: 0.7rem;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
}

.mobile-menu-toggle {
  display: none;
  background: var(--vp-white);
  border: 1px solid var(--vp-border-strong);
  border-radius: var(--vp-radius);
  padding: 0.45rem 0.85rem;
  font-size: 0.86rem;
  font-weight: 600;
  color: var(--vp-text);
  cursor: pointer;
}

/* ==========================================================================
   BOUTONS PROFESSIONNELS
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.75rem 1.4rem;
  border-radius: var(--vp-radius);
  font-weight: 600;
  font-size: 0.92rem;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.18s ease;
  text-align: center;
  font-family: inherit;
  white-space: nowrap;
}

.btn-green {
  background-color: var(--vp-green);
  color: var(--vp-white);
}

.btn-green:hover {
  background-color: var(--vp-green-dark);
}

.btn-terracotta {
  background-color: var(--vp-terracotta);
  color: var(--vp-white);
}

.btn-terracotta:hover {
  background-color: var(--vp-terracotta-dark);
}

.btn-outline {
  background-color: var(--vp-white);
  color: var(--vp-text);
  border-color: var(--vp-border-strong);
}

.btn-outline:hover {
  background-color: var(--vp-cream);
  border-color: var(--vp-green);
  color: var(--vp-green-dark);
}

.btn-beige {
  background-color: var(--vp-beige);
  color: var(--vp-text);
  border-color: var(--vp-beige-dark);
}

.btn-beige:hover {
  background-color: var(--vp-beige-dark);
}

.btn-danger {
  background-color: var(--vp-danger);
  color: var(--vp-white);
}

.btn-sm {
  padding: 0.48rem 0.9rem;
  font-size: 0.83rem;
}

.btn-lg {
  padding: 0.92rem 1.75rem;
  font-size: 0.96rem;
}

/* ==========================================================================
   HERO FULL-BLEED SPLIT (Style Grande Plateforme Internationale)
   ========================================================================== */
.hero-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 560px;
  background-color: var(--vp-cream);
  border-bottom: 1px solid var(--vp-border);
}

.hero-split-content {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 4.5rem 4rem 4.5rem max(1.5rem, calc((100vw - 1280px) / 2 + 1.5rem));
}

html[dir="rtl"] .hero-split-content {
  padding: 4.5rem max(1.5rem, calc((100vw - 1280px) / 2 + 1.5rem)) 4.5rem 4rem;
}

.hero-eyebrow {
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: var(--vp-terracotta-dark);
  margin-bottom: 1rem;
}

.hero-headline {
  font-size: clamp(2.15rem, 3.6vw, 3.15rem);
  font-weight: 700;
  color: var(--vp-green-deep);
  line-height: 1.15;
  letter-spacing: -0.025em;
  margin-bottom: 1.25rem;
  max-width: 560px;
}

html[dir="rtl"] .hero-headline {
  letter-spacing: 0;
  line-height: 1.28;
}

.hero-subcopy {
  font-size: 1.03rem;
  color: var(--vp-text-secondary);
  max-width: 520px;
  margin-bottom: 2.2rem;
  line-height: 1.7;
}

.hero-cta-row {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  flex-wrap: wrap;
}

.hero-split-media {
  position: relative;
  min-height: 420px;
  background-color: var(--vp-beige);
  overflow: hidden;
}

.hero-split-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

/* Bande d'indicateurs institutionnels */
.trust-strip {
  background-color: var(--vp-white);
  border-bottom: 1px solid var(--vp-border);
}

.trust-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}

.trust-cell {
  padding: 1.5rem 1.25rem;
  border-inline-end: 1px solid var(--vp-border);
}

.trust-cell:last-child {
  border-inline-end: none;
}

.trust-cell strong {
  display: block;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--vp-green-deep);
  margin-bottom: 0.15rem;
}

.trust-cell span {
  font-size: 0.85rem;
  color: var(--vp-muted);
}

/* ==========================================================================
   SECTIONS & VITRINES COMMERCIALES
   ========================================================================== */
.section {
  padding: 4.5rem 0;
}

.section-white {
  background-color: var(--vp-white);
  border-top: 1px solid var(--vp-border);
  border-bottom: 1px solid var(--vp-border);
}

.section-beige {
  background-color: var(--vp-beige);
  border-top: 1px solid var(--vp-border);
  border-bottom: 1px solid var(--vp-border);
}

.section-head-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 1.5rem;
  margin-bottom: 2.5rem;
  flex-wrap: wrap;
}

.section-header {
  max-width: 680px;
  margin-bottom: 2.5rem;
}

.section-eyebrow {
  display: block;
  font-size: 0.76rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.3px;
  color: var(--vp-terracotta-dark);
  margin-bottom: 0.45rem;
}

.section-title {
  font-size: clamp(1.6rem, 2.5vw, 2.15rem);
  font-weight: 700;
  color: var(--vp-green-deep);
  letter-spacing: -0.02em;
  line-height: 1.22;
}

html[dir="rtl"] .section-title {
  letter-spacing: 0;
}

.section-subtitle {
  font-size: 0.97rem;
  color: var(--vp-text-secondary);
  margin-top: 0.45rem;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2rem;
}

/* Vitrine Produit Phare */
.product-feature-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3.5rem;
  align-items: center;
}

.product-studio-frame {
  background-color: var(--vp-cream);
  border: 1px solid var(--vp-border);
  border-radius: var(--vp-radius-lg);
  overflow: hidden;
  aspect-ratio: 4 / 3;
}

.product-studio-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.specs-table-clean {
  width: 100%;
  border-top: 1px solid var(--vp-border);
  margin-top: 1.5rem;
}

.specs-table-clean .spec-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.85rem 0;
  border-bottom: 1px solid var(--vp-border);
  font-size: 0.93rem;
}

.specs-table-clean .spec-label {
  color: var(--vp-muted);
  font-weight: 500;
}

.specs-table-clean .spec-val {
  color: var(--vp-text);
  font-weight: 600;
}

/* Vitrine Matières Premières */
.materials-banner-photo {
  width: 100%;
  height: 310px;
  border-radius: var(--vp-radius-lg);
  overflow: hidden;
  border: 1px solid var(--vp-border);
  margin-bottom: 2rem;
}

.materials-banner-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.pro-card {
  background-color: var(--vp-white);
  border: 1px solid var(--vp-border);
  border-radius: var(--vp-radius-lg);
  padding: 1.75rem;
  box-shadow: var(--vp-shadow-xs);
}

.card {
  background-color: var(--vp-white);
  border: 1px solid var(--vp-border);
  border-radius: var(--vp-radius-lg);
  padding: 1.75rem;
  box-shadow: var(--vp-shadow-xs);
}

/* Processus en 3 étapes épuré */
.process-grid-pro {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--vp-border-strong);
  border-radius: var(--vp-radius-lg);
  background-color: var(--vp-white);
  overflow: hidden;
}

.process-col {
  padding: 2.25rem 2rem;
  border-inline-end: 1px solid var(--vp-border);
}

.process-col:last-child {
  border-inline-end: none;
}

.process-index {
  display: inline-block;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--vp-terracotta-dark);
  letter-spacing: 1px;
  margin-bottom: 0.85rem;
}

.process-col h3 {
  font-size: 1.12rem;
  color: var(--vp-green-deep);
  margin-bottom: 0.55rem;
}

.process-col p {
  font-size: 0.92rem;
  color: var(--vp-text-secondary);
}

/* FAQ Accordion propre */
.faq-accordion {
  border-top: 1px solid var(--vp-border);
}

.faq-item {
  border-bottom: 1px solid var(--vp-border);
}

.faq-item summary {
  padding: 1.15rem 0;
  font-weight: 600;
  font-size: 0.97rem;
  color: var(--vp-green-deep);
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.faq-item summary::-webkit-details-marker {
  display: none;
}

.faq-item summary::after {
  content: "+";
  font-size: 1.25rem;
  font-weight: 400;
  color: var(--vp-terracotta);
}

.faq-item[open] summary::after {
  content: "−";
}

.faq-answer {
  padding: 0 0 1.25rem;
  color: var(--vp-text-secondary);
  font-size: 0.92rem;
  line-height: 1.7;
}

/* ==========================================================================
   FORMULAIRES & PAGES INTERNES
   ========================================================================== */
.page-banner {
  background-color: var(--vp-white);
  border-bottom: 1px solid var(--vp-border);
  padding: 2.5rem 0;
}

.form-group {
  margin-bottom: 1.15rem;
}

.form-label {
  display: block;
  font-weight: 600;
  font-size: 0.88rem;
  margin-bottom: 0.4rem;
  color: var(--vp-text);
}

.form-control {
  width: 100%;
  padding: 0.72rem 0.95rem;
  border-radius: var(--vp-radius);
  border: 1px solid var(--vp-border-strong);
  background-color: var(--vp-white);
  color: var(--vp-text);
  font-size: 0.94rem;
  font-family: inherit;
  transition: border-color 0.16s ease, box-shadow 0.16s ease;
}

.form-control:focus {
  outline: none;
  border-color: var(--vp-green);
  box-shadow: 0 0 0 3px rgba(82, 107, 72, 0.14);
}

textarea.form-control {
  min-height: 100px;
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.form-hint {
  font-size: 0.8rem;
  color: var(--vp-muted);
  margin-top: 0.3rem;
}

.material-selector-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.material-option-card {
  background-color: var(--vp-white);
  border: 1.5px solid var(--vp-border);
  border-radius: var(--vp-radius-lg);
  padding: 1.25rem;
  cursor: pointer;
  transition: all 0.18s ease;
}

.material-option-card:hover {
  border-color: var(--vp-terracotta);
}

.material-option-card.selected {
  border-color: var(--vp-terracotta);
  background-color: var(--vp-terracotta-soft);
}

.material-option-card h4 {
  color: var(--vp-green-deep);
  font-size: 1rem;
  margin-bottom: 0.3rem;
}

.material-option-card p {
  font-size: 0.85rem;
  color: var(--vp-text-secondary);
}

.material-row-item {
  padding: 1.15rem;
  background-color: var(--vp-cream);
  border: 1px solid var(--vp-border);
  border-radius: var(--vp-radius);
}

/* Alertes */
.alert {
  padding: 1rem 1.25rem;
  border-radius: var(--vp-radius);
  margin-bottom: 1.35rem;
  border: 1px solid var(--vp-border);
  border-inline-start: 4px solid var(--vp-green);
  background-color: var(--vp-green-soft);
  font-size: 0.92rem;
}

.alert-warning {
  border-inline-start-color: var(--vp-terracotta);
  background-color: var(--vp-terracotta-soft);
  color: #543019;
}

.alert-error {
  border-inline-start-color: var(--vp-danger);
  background-color: #FCEAE8;
  color: #781E14;
}

.alert-success {
  border-inline-start-color: var(--vp-success);
  background-color: #E6F3EA;
  color: #1B4B28;
}

/* Badges de statut */
.status-badge {
  display: inline-flex;
  align-items: center;
  padding: 0.22rem 0.65rem;
  border-radius: 6px;
  font-size: 0.76rem;
  font-weight: 600;
  white-space: nowrap;
}

.status-pending, .status-new {
  background-color: #FEF3C7;
  color: #92400E;
}

.status-under_review, .status-preparing {
  background-color: #E0F2FE;
  color: #075985;
}

.status-negotiation {
  background-color: var(--vp-terracotta-soft);
  color: var(--vp-terracotta-dark);
  border: 1px solid var(--vp-terracotta);
}

.status-accepted, .status-confirmed, .status-collection_scheduled, .status-shipped {
  background-color: #DCFCE7;
  color: #166534;
}

.status-collected, .status-completed, .status-delivered, .status-paid {
  background-color: var(--vp-green);
  color: var(--vp-white);
}

.status-rejected, .status-cancelled {
  background-color: #FEE2E2;
  color: #991B1B;
}

.status-to_pay {
  background-color: #FFEDD5;
  color: #9A3412;
}

/* ==========================================================================
   ADMIN & ESPACE UTILISATEUR (Style Enterprise Dashboard)
   ========================================================================== */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1rem;
  margin-bottom: 1.75rem;
}

.kpi-card {
  background-color: var(--vp-white);
  border-radius: var(--vp-radius-lg);
  padding: 1.3rem 1.4rem;
  border: 1px solid var(--vp-border);
  box-shadow: var(--vp-shadow-xs);
}

.kpi-label {
  font-size: 0.82rem;
  color: var(--vp-muted);
  font-weight: 500;
  margin-bottom: 0.4rem;
}

.kpi-value {
  font-size: 1.65rem;
  font-weight: 700;
  color: var(--vp-green-deep);
  letter-spacing: -0.02em;
}

.kpi-card.accent .kpi-value {
  color: var(--vp-terracotta-dark);
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  background-color: var(--vp-white);
  border-radius: var(--vp-radius-lg);
  border: 1px solid var(--vp-border);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

.data-table th, .data-table td {
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--vp-border);
  text-align: start;
  vertical-align: top;
}

.data-table th {
  background-color: var(--vp-cream);
  color: var(--vp-text-secondary);
  font-weight: 600;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  white-space: nowrap;
}

.data-table tr:hover td {
  background-color: #FCFBF8;
}

.tabs-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-bottom: 1.75rem;
  border-bottom: 1px solid var(--vp-border);
}

.tab-link {
  padding: 0.72rem 1.1rem;
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--vp-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  cursor: pointer;
}

.tab-link:hover {
  color: var(--vp-green-deep);
}

.tab-link.active {
  color: var(--vp-green);
  border-bottom-color: var(--vp-green);
}

.thumb-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 0.5rem;
}

.thumb-img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: var(--vp-radius);
  border: 1px solid var(--vp-border);
}

/* ==========================================================================
   FOOTER INSTITUTIONNEL
   ========================================================================== */
.site-footer {
  margin-top: auto;
  background-color: var(--vp-green-deep);
  color: var(--vp-cream);
  padding: 4rem 0 2rem;
}

.footer-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1fr;
  gap: 2.5rem;
  margin-bottom: 2.75rem;
}

.footer-title {
  color: var(--vp-white);
  font-size: 0.84rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 700;
  margin-bottom: 1rem;
}

.footer-links {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  font-size: 0.89rem;
  color: #C7D1C3;
}

.footer-links a:hover {
  color: var(--vp-white);
}

.footer-bottom {
  border-top: 1px solid rgba(250, 248, 243, 0.12);
  padding-top: 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
  font-size: 0.82rem;
  color: #9EAB99;
}

@media (max-width: 1024px) {
  .hero-split,
  .product-feature-grid,
  .process-grid-pro,
  .trust-grid,
  .grid-3,
  .grid-2,
  .material-selector-grid,
  .footer-grid {

  .nav-links.open {

  }

  .nav-link {

  }
}

    grid-template-columns: 1fr;

    padding: 1.25rem;
  }

ivery_policy": {"fr": "Les frais et modalités de livraison ainsi que le moyen de paiement (paiement à la livraison ou électronique) sont précisés et confirmés par l'administratrice selon la wilaya.", "ar": "يتم تحديد وتأكيد تكاليف وشروط التوصيل بالإضافة إلى وسيلة الدفع (الدفع عند الاستلام أو الدفع الإلكتروني) من طرف المديرة حسب الولاية."}, "faq_json": {"fr": "[{\"q\":\"Comment vendre mes matières premières à VIVAPOT ?\",\"a\":\"Créez un compte, rendez-vous sur « Vendre vos matières », choisissez la matière (textile usagé, jrid ou carton), indiquez la quantité disponible, l'état/propreté, ajoutez des photos et votre localisation (wilaya et commune). L'administratrice examinera votre offre, proposera un prix d'achat et conviendra avec vous des modalités de collecte.\"},{\"q\":\"L'envoi d'une offre garantit-il un achat automatique ?\",\"a\":\"Non. L'envoi d'une offre ne garantit pas son acceptation ni un achat automatique. Aucun prix public automatique n'est imposé : l'administratrice étudie chaque offre, fixe le prix proposé et confirme la collecte après échange avec le fournisseur.\"},{\"q\":\"Comment est calculé le montant payé au fournisseur ?\",\"a\":\"Le montant total est calculé exactement selon la formule : Quantité finale réellement reçue et pesée × Prix final convenu par unité (DA/kg).\"},{\"q\":\"Puis-je utiliser le même compte pour acheter le pot et vendre des matières ?\",\"a\":\"Oui. Un seul compte utilisateur sur VIVAPOT vous permet à la fois de déposer des offres de matières premières (Fournisseur) et de commander notre pot écologique (Client).\"}]", "ar": "[{\"q\":\"كيف يمكنني بيع المواد الأولية لمنصة VIVAPOT؟\",\"a\":\"أنشئ حساباً، توجه إلى قسم « بيع موادكم الأولية »، اختر المادة (منسوجات مستعملة، جريد النخيل، أو كرتون)، حدد الكمية المتوفرة، الحالة والنظافة، أرفق صوراً وموقعك (الولاية والبلدية). ستقوم المديرة بدراسة عرضك واقتراح سعر الشراء والاتفاق معك على شروط الجمع.\"},{\"q\":\"هل إرسال عرض مادة يضمن الشراء التلقائي؟\",\"a\":\"لا. إرسال العرض لا يضمن قبوله ولا الشراء التلقائي. لا يوجد سعر عام مفروض تلقائياً؛ بل تدرس المديرة كل عرض وتحدد السعر المقترح وتؤكد عملية الجمع بعد التواصل مع المورد.\"},{\"q\":\"كيف يتم حساب المبلغ الإجمالي المدفوع للمورد؟\",\"a\":\"يُحسب المبلغ الإجمالي بدقة وفق المعادلة: الكمية النهائية المستلمة والموزونة فعلياً × السعر النهائي المتفق عليه للوحدة (د.ج / كغ).\"},{\"q\":\"هل يمكنني استخدام نفس الحساب لشراء الأصيص ولبيع المواد الأولية؟\",\"a\":\"نعم، حساب واحد في VIVAPOT يتيح لك أن تكون مورداً للمواد الأولية وزبوناً لشراء الأصيص البيئي في نفس الوقت.\"}]"}}, "T": {"fr": {"site_name": "VIVAPOT", "tagline": "Quand le déchet reprend vie", "nav_home": "Accueil", "nav_buy_pot": "Acheter notre pot", "nav_sell_materials": "Vendre vos matières", "nav_about": "À propos", "nav_faq": "FAQ", "nav_contact": "Contact", "nav_user_space": "Mon Espace", "nav_admin": "Administration", "nav_login": "Connexion / Inscription", "nav_logout": "Déconnexion", "menu_btn": "Menu", "currency_short": "DA", "unit_kg": "kg", "email_label": "Email", "whatsapp_label": "WhatsApp", "to_confirm": "À confirmer par l'administratrice", "cta_buy_pot": "Acheter notre pot", "cta_sell_materials": "Vendre vos matières", "hero_badge": "Économie Circulaire — Algérie", "steps_title": "Notre démarche de valorisation en 3 étapes", "step1_title": "1. Collecte des matières", "step1_desc": "Vous proposez vos matières récupérables (textile usagé, jrid ou carton). L'administratrice examine l'offre, fixe le prix et organise la collecte selon votre wilaya.", "step2_title": "2. Valorisation & Fabrication", "step2_desc": "Les matières collectées et pesées sont transformées localement en Algérie selon un procédé écologique.", "step3_title": "3. Vente du pot écologique", "step3_desc": "Commercialisation exclusive par l'administratrice de notre modèle unique de pot écologique durable.", "shop_title": "Acheter notre pot écologique", "shop_subtitle": "Vente exclusive par l'administratrice d'un modèle unique fabriqué à partir de matières valorisées.", e\nVIVAPOT est une plateforme web algérienne comportant deux activités complémentaires : la vente exclusive par l'administratrice d'un pot écologique fabriqué à partir de matières valorisées, et l'achat par l'administratrice auprès du public et de fournisseurs de trois matières premières récupérables : textile usagé, jrid (palmes sèches de palmier dattier) et carton.\n\n2. Règles relatives aux offres de matières premières\nL'envoi d'une offre de matière première sur la plateforme ne garantit ni son acceptation ni un achat automatique. Aucun prix public automatique n'est imposé : l'administratrice examine chaque offre, fixe le prix d'achat proposé et convient avec le fournisseur des modalités de collecte selon la wilaya. Le montant final payé correspond à la quantité finale réellement reçue et pesée multipliée par le prix unitaire final convenu.\n\n3. Compte utilisateur unique\nUn même compte utilisateur permet d'agir à la fois en tant que Fournisseur de matières premières et Client acheteur du pot écologique.", "ar": "1. موضوع المنصة\nVIVAPOT هي منصة ويب جزائرية تضم نشاطين متكاملين: البيع الحصري من طرف المديرة لأصيص بيئي مصنوع من مواد مثمنة، وشراء المديرة لثلاث مواد أولية قابلة للاسترجاع من الجمهور والموردين: منسوجات مستعملة، جريد النخيل الجاف، وكرتون.\n\n2. قواعد عروض المواد الأولية\nإرسال عرض مادة أولية عبر المنصة لا يضمن قبوله ولا يعني شراءً تلقائياً. لا يوجد سعر عام مفروض تلقائياً: تدرس المديرة كل عرض، وتحدد سعر الشراء المقترح وتتفق مع المورد على شروط الجمع حسب الولاية. المبلغ النهائي يُحسب على أساس الكمية النهائية المستلمة فعلياً مضروبة في سعر الوحدة المتفق عليه.\n\n3. حساب المستخدم الموحد\nيتيح حساب واحد للمستخدم العمل كمورد للمواد الأولية وكزبون لشراء الأصيص البيئي."}, "confidentialite": {"fr": "Protection des données personnelles sur VIVAPOT :\n- Aucune adresse personnelle ni coordonnée de fournisseur ou de client n'est publiée publiquement.\n- Chaque fournisseur ne consulte que ses propres offres, ses propres échanges et leur statut.\n- Chaque client ne consulte que ses propres commandes et informations personnelles.\n- Les mots de passe sont chiffrés de manière sécurisée.", "ar": "حماية البيانات الشخصية على منصة VIVAPOT:\n- لا يتم نشر أي عنوان شخصي أو بيانات خاصة بالموردين أو الزبائن للعموم.\n- يطلع كل مورد على عروضه ومراسلاته وحالتها فقط.\n- يطلع كل زبون على طلباته ومعلوماته الشخصية فقط.\n- يتم تشفير كلمات المرور بطريقة آمنة."}}}</script>

function cyrb(str) { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16); }
async function pbkdf(pw, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode('vivapot::' + salt), iterations: 150000, hash: 'SHA-256' }, k, 256);
  return 'p:' + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
async function hashPw(pw, salt) {
  const s = 'vivapot::' + salt + '::' + pw;
  try { if (window.crypto && crypto.subtle) return await pbkdf(pw, salt); } catch (e) { }
  try { if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return 's:' + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } } catch (e) { }
  return 'c:' + cyrb(s) + cyrb(s.split('').reverse().join(''));
}
async function checkPw(pw, u) {
  const s = 'vivapot::' + u.id + '::' + pw, h = u.hash || '';
  try {
    if (h.startsWith('p:')) return (await pbkdf(pw, u.id)) === h;
    if (h.startsWith('s:')) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return 's:' + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('') === h; }
  } catch (e) { return false; }
  return h === 'c:' + cyrb(s) + cyrb(s.split('').reverse().join(''));
}

function readImg(file, maxW = 900, q = 0.72) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const r = Math.min(1, maxW / im.width), c = document.createElement('canvas');
        c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function checkFiles(files, max = 5) {
  if (files.length > max) { alert(L(`Maximum ${max} photos autorisées.`, `الحد الأقصى هو ${max} صور فقط.`)); return false; }
  for (const f of files) {
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(f.type)) { alert(L('Format non supporté : ', 'صيغة الصورة غير مدعومة: ') + f.name); return false; }
    if (f.size > 4 * 1024 * 1024) { alert(L('Le fichier dépasse la limite de 4 Mo : ', 'حجم الصورة يتجاوز 4 ميغابايت: ') + f.name); return false; }
  }
  return true;
}

const AF = { mat: '', wil: '', st: '', q: '' };
function adminStats() {
  const offers = DB.offers, ord = DB.orders;
  const exp = DB.purchases.reduce((s, p) => s + (p.pay === 'paid' ? p.total : 0), 0);
  const expAll = DB.purchases.reduce((s, p) => s + (p.total || 0), 0);
  const rev = ord.filter(o => o.status !== 'cancelled' && o.pay_status === 'paid').reduce((s, o) => s + o.total, 0);
  return { users: DB.users.filter(u => u.role !== 'admin').length, nw: offers.filter(o => o.status === 'pending').length, neg: offers.filter(o => o.status === 'negotiation').length, rec: offers.filter(o => ['collected', 'completed'].includes(o.status)).length, ord: ord.length, stock: prod().stock, rev, exp, expAll };
}

    if (!trySave()) { DB.offers.pop(); DB.seq.offer--; alert(L('Espace de stockage plein : réduisez le nombre de photos.', 'مساحة التخزين ممتلئة: قلل عدد الصور.')); return; }
    SELL_IMGS = []; flash('success', L('Offre #' + id + ' envoyée avec succès. Elle ne garantit pas un achat automatique.', 'تم إرسال العرض رقم #' + id + ' بنجاح. إرسال العرض لا يضمن الشراء تلقائياً.'));
    go('#/espace/offers');
  },
  msg(f) {
    const adm = admins()[0]; if (!adm) return;
    const text = val(f, 'text'), oid = +val(f, 'offer_id') || null; if (!text) return;
    DB.msgs.push({ id: nid('msg'), from: ME.id, to: adm.id, offer_id: oid, order_id: null, text, created: now(), read: null });
    notifyAdmins(L('Message de ' + ME.name, 'رسالة من ' + ME.name), text.slice(0, 120), oid ? 'material_offer' : '', oid);
    save(); flash('success', L("Votre message a été envoyé à l'administratrice.", 'تم إرسال رسالتك إلى المديرة.')); render();
  },
  profile(f) {
    const u = byId(DB.users, ME.id); u.name = val(f, 'name'); u.phone = val(f, 'phone'); u.wilaya_id = +val(f, 'wilaya_id') || null; u.mun_id = +val(f, 'mun_id') || null;
    save(); flash('success', L('Vos coordonnées ont été mises à jour.', 'تم تحديث بيانات حسابك بنجاح.')); render();
  },
  async pw(f) {
    const u = byId(DB.users, ME.id);
    if (!(await checkPw(f.elements.old.value, u))) { flash('error', L('Mot de passe actuel incorrect.', 'كلمة المرور الحالية غير صحيحة.')); return render(); }
    const np = f.elements.new.value;
    if (np.length < 8 || np === ADMIN_PASS || np === f.elements.old.value) { flash('error', L('Nouveau mot de passe trop faible ou identique (8 caractères min.).', 'كلمة المرور الجديدة ضعيفة أو مطابقة (8 أحرف على الأقل).')); return render(); }
    u.hash = await hashPw(np, u.id); delete u.mustChange; save(); flash('success', L('Mot de passe modifié.', 'تم تغيير كلمة المرور.')); render();
  },
  admreply(f) {
    const text = val(f, 'text'); if (!text) return;
    DB.msgs.push({ id: nid('msg'), from: ME.id, to: f.dataset.to, offer_id: null, order_id: null, text, created: now(), read: null });
    notify(f.dataset.to, L("Message de l'administratrice", 'رسالة من المديرة'), text.slice(0, 120));
    save(); flash('success', L('Réponse envoyée.', 'تم إرسال الرد.')); render();
  },
  afilter(f) { AF.mat = val(f, 'mat'); AF.wil = val(f, 'wil'); AF.st = val(f, 'st'); AF.q = val(f, 'q'); render(); },
  updoffer(f) {
    const o = byId(DB.offers, +f.dataset.id); if (!o) return;
    const st = val(f, 'status'), proposed = num(val(f, 'proposed')), agreed = num(val(f, 'agreed')) ?? proposed ?? 0, rec = num(val(f, 'received')) ?? 0, pay = val(f, 'pay');
    const total = Math.round(rec * agreed * 100) / 100, cdate = val(f, 'cdate') || null, cloc = val(f, 'cloc') || o.pickup, notes = val(f, 'notes'), msg = val(f, 'msg');
    o.status = st; o.price = proposed; o.notes = notes;
    const pst = st === 'collected' ? 'collected' : st === 'completed' ? 'completed' : ['rejected', 'cancelled'].includes(st) ? 'cancelled' : 'scheduled';
    let pu = DB.purchases.find(p => p.offer_id === o.id);
    if (pu) Object.assign(pu, { received: rec, price: agreed, total, cdate, cloc, pay, status: pst, notes });
    else { pu = { id: nid('purchase'), offer_id: o.id, received: rec, price: agreed, total, cdate, cloc, pay, status: pst, notes, created: now() }; DB.purchases.push(pu); }
    if (total > 0) {
      let tx = DB.tx.find(t => t.purchase_id === pu.id);
      if (tx) { tx.amount = total; tx.status = pay; if (pay === 'paid' && !tx.paid_at) tx.paid_at = now(); }
      else DB.tx.push({ id: nid('tx'), type: 'material_purchase', purchase_id: pu.id, order_id: null, amount: total, method: 'cash', status: pay, paid_at: pay === 'paid' ? now() : null, created: now() });
    }
    if (msg) DB.msgs.push({ id: nid('msg'), from: ME.id, to: o.supplier_id, offer_id: o.id, order_id: null, text: msg, created: now(), read: null });
    const priceTxt = proposed != null ? L(' | Prix proposé : ' + proposed + ' DA/' + o.unit, ' | السعر المقترح: ' + proposed + ' د.ج/' + unitL(o.unit)) : '';
    const totTxt = total > 0 ? L(' | Montant total (' + rec + ' × ' + agreed + ') : ' + total + ' DA', ' | المبلغ الإجمالي (' + rec + ' × ' + agreed + '): ' + total + ' د.ج') : '';
    notify(o.supplier_id, L('Mise à jour de votre offre #' + o.id, 'تحديث حالة العرض رقم #' + o.id), L('Nouveau statut : ', 'الحالة الجديدة: ') + stOffer(st) + priceTxt + totTxt, 'material_offer', o.id);
    audit(ME.id, 'material_offer', o.id, 'Offre #' + o.id + ' -> ' + st, 'Qté déclarée: ' + o.qty + ' | Qté reçue: ' + rec + ' | Prix convenu: ' + agreed + ' DA | Total: ' + total + ' DA');
    save(); flash('success', L('Offre #' + o.id + ' enregistrée. Montant calculé : ' + money(total), 'تم حفظ العرض رقم #' + o.id + '. المبلغ المحسوب: ' + money(total))); render();
  },
  updorder(f) {
    const o = byId(DB.orders, +f.dataset.id), p = prod(); if (!o) return;
    const st = val(f, 'status'), fee = num(val(f, 'fee'));
    o.status = st; o.method = val(f, 'method'); o.pay_status = val(f, 'pay'); o.fee = fee;
    if (!(o.subtotal > 0) && p.price != null) o.subtotal = Math.round(p.price * o.qty * 100) / 100;
    o.total = Math.round((o.subtotal + (fee || 0)) * 100) / 100;
    if (['confirmed', 'preparing', 'shipped', 'delivered'].includes(st) && !o.deducted) { p.stock = Math.max(0, p.stock - o.qty); o.deducted = 1; }
    else if (st === 'cancelled' && o.deducted) { p.stock += o.qty; o.deducted = 0; }
    if (o.total > 0) {
      let tx = DB.tx.find(t => t.order_id === o.id);
      if (tx) { tx.amount = o.total; tx.method = o.method; tx.status = o.pay_status; if (o.pay_status === 'paid' && !tx.paid_at) tx.paid_at = now(); }
      else DB.tx.push({ id: nid('tx'), type: 'product_sale', purchase_id: null, order_id: o.id, amount: o.total, method: o.method, status: o.pay_status, paid_at: o.pay_status === 'paid' ? now() : null, created: now() });
    }
    if (o.customer_id) notify(o.customer_id, L('Mise à jour de votre commande #' + o.id, 'تحديث حالة طلبكم رقم #' + o.id), L('Statut de votre commande : ', 'حالة الطلب: ') + stOrder(st) + (o.total > 0 ? L(' | Montant total : ', ' | المبلغ الإجمالي: ') + money(o.total) : ''), 'customer_order', o.id);
    audit(ME.id, 'customer_order', o.id, 'Commande #' + o.id + ' -> ' + st, 'Total ' + o.total);
    save(); flash('success', L('Commande #' + o.id + ' mise à jour.', 'تم تحديث الطلب رقم #' + o.id + ' بنجاح.')); render();
  },
  async product(f) {
    const p = prod(), files = [...f.elements.photos.files];
    if (!checkFiles(files, 6)) return;
    let ims = []; try { ims = await Promise.all(files.map(x => readImg(x, 1000, 0.75))); } catch (e) { alert(L("Impossible de lire l'image.", 'تعذر قراءة الصورة.')); return; }
    Object.assign(p, { fr: val(f, 'fr'), ar: val(f, 'ar'), dfr: val(f, 'dfr'), dar: val(f, 'dar'), price: num(val(f, 'price')), stock: Math.max(0, parseInt(val(f, 'stock'), 10) || 0), dimensions: val(f, 'dimensions'), weight: val(f, 'weight'), cfr: f.elements.cfr.value, car: f.elements.car.value, available: f.elements.available.checked ? 1 : 0 });
    p.images = p.images.concat(ims);
    audit(ME.id, 'product', p.id, 'Produit mis à jour', 'Prix ' + p.price + ' | Stock ' + p.stock);
    if (!trySave()) { alert(L('Espace de stockage plein : réduisez la taille des photos.', 'مساحة التخزين ممتلئة: قلل حجم الصور.')); return; }
    flash('success', L('Produit mis à jour.', 'تم تحديث المنتج.')); render();
  },
  addmat(f) {
    const id = nid('material'); DB.materials.push({ id, slug: 'mat-' + id, fr: val(f, 'fr'), ar: val(f, 'ar'), dfr: val(f, 'dfr'), dar: val(f, 'dar'), unit: 'kg', active: 1 });
    save(); flash('success', L('Matière ajoutée.', 'تمت إضافة المادة.')); render();
  },
  fees(f) { DB.fees = {}; SEED.wil.forEach(w => { const v = num(f.elements['f' + w.id].value); if (v != null) DB.fees[w.id] = v; }); save(); flash('success', L('Frais de livraison enregistrés.', 'تم حفظ تكاليف التوصيل.')); render(); },
  contents(f) {
    ['hero_title', 'hero_subtitle', 'about_text', 'delivery_policy', 'contact_phone', 'contact_whatsapp', 'contact_email'].forEach(k => { DB.contents[k] = { fr: f.elements[k + '_fr'].value.trim(), ar: f.elements[k + '_ar'].value.trim() }; });
    const fr = [], ar = [];
    $$('.faq-edit', f).forEach(r => { const g = n => r.querySelector('[data-f=' + n + ']').value.trim(); if (g('qfr') || g('qar')) { fr.push({ q: g('qfr'), a: g('afr') }); ar.push({ q: g('qar'), a: g('aar') }); } });
    DB.contents.faq_json = { fr: JSON.stringify(fr), ar: JSON.stringify(ar) };
    save(); flash('success', L('Contenus enregistrés.', 'تم حفظ المحتوى.')); render();
  }
};
function trySave() { try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); return true; } catch (e) { if (e && (e.name === 'QuotaExceededError' || e.code === 22)) return false; store.set(DB_KEY, JSON.stringify(DB)); return true; } }

const CLICKS = {
  menu() { $('#mainNavLinks').classList.toggle('open'); },
  lang(el) { LANG = el.dataset.v; store.set(LANG_KEY, LANG); render(); },
  logout() { store.del(SES_KEY); flash('success', L('Vous avez été déconnecté avec succès.', 'تم تسجيل الخروج بنجاح.')); go('#/home'); },
  shopimg(el) { SHOP_IMG = +el.dataset.v; $('#shopMain').src = prod().images[SHOP_IMG]; },
  selmat(el) { SELL_MAT = +el.dataset.v; const keep = snapshotForm('offer'); render(); restoreForm('offer', keep); },
  'cancel-offer'(el) {
    const o = byId(DB.offers, +el.dataset.v); if (!o || !confirm(L('Annuler cette offre ?', 'هل تريد إلغاء هذا العرض؟'))) return;
    o.status = 'cancelled'; notifyAdmins(L('Offre #' + o.id + ' annulée', 'تم إلغاء العرض #' + o.id), o.supplier_name, 'material_offer', o.id); save(); render();
  },
  'read-notifs'() { DB.notifs.forEach(n => { if (n.user_id === ME.id) n.read = 1; }); save(); render(); },
  'afilter-reset'() { Object.assign(AF, { mat: '', wil: '', st: '', q: '' }); render(); },
  export(el) { exportCsv(el.dataset.v); },
  'toggle-user'(el) { const u = byId(DB.users, el.dataset.v); if (u) { u.active = u.active ? 0 : 1; save(); render(); } },
  'toggle-mat'(el) { const m = mat(el.dataset.v); if (m) { m.active = m.active ? 0 : 1; save(); render(); } },
  'del-pimg'(el) { if (!confirm(L('Supprimer cette photo ?', 'حذف هذه الصورة؟'))) return; prod().images.splice(+el.dataset.v, 1); save(); render(); },
  'faq-add'() { $('#faqRows').insertAdjacentHTML('beforeend', faqRow({}, {})); },
  'faq-del'(el) { el.closest('.faq-edit').remove(); },
  backup() { downloadFile('vivapot_sauvegarde_' + now().replace(/[: ]/g, '-') + '.json', JSON.stringify(DB), 'application/json'); },
  async 'reset-all'() { if (!confirm(L('Effacer TOUTES les données et revenir à zéro ?', 'هل تريد مسح كل البيانات والعودة للصفر؟'))) return; store.del(SES_KEY); DB = await seedDB(); save(); flash('success', L('Données réinitialisées.', 'تمت إعادة تهيئة البيانات.')); go('#/home'); }
};
function snapshotForm(name) { const f = $(`form[data-form=${name}]`); if (!f) return null; const o = {}; [...f.elements].forEach(e => { if (e.name && e.type !== 'file') o[e.name] = e.value; }); return o; }
function restoreForm(name, snap) { const f = $(`form[data-form=${name}]`); if (!f || !snap) return; Object.keys(snap).forEach(k => { if (f.elements[k] && k !== 'material_id') f.elements[k].value = snap[k]; }); const w = f.elements.wilaya_id; if (w && snap.mun_id) { $('#sc').innerHTML = communeOpts(w.value, snap.mun_id); } }

function exportCsv(type) {
  const rows = []; const date = now().slice(0, 10);
  if (type === 'offers') { rows.push(['ID Offre', 'Fournisseur', 'Telephone', 'Matiere', 'Quantite Declaree', 'Unite', 'Etat', 'Proprete', 'Wilaya', 'Commune', 'Lieu', 'Prix Propose', 'Statut', 'Date']); DB.offers.forEach(o => rows.push([o.id, o.supplier_name, o.supplier_phone, (mat(o.material_id) || {}).fr, o.qty, o.unit, SEED.T.fr['condition_' + o.condition], SEED.T.fr['cleanliness_' + o.cleanliness], (wil(o.wilaya_id) || {}).fr, (mun(o.mun_id) || {}).fr, o.pickup, o.price ?? '', SEED.T.fr['offer_status_' + o.status], o.created])); }
  else if (type === 'purchases') { rows.push(['ID Achat', 'ID Offre', 'Fournisseur', 'Matiere', 'Quantite Declaree', 'Quantite Recue', 'Prix Unitaire Convenu', 'Montant Total', 'Date Collecte', 'Lieu Collecte', 'Paiement']); DB.purchases.forEach(p => { const o = byId(DB.offers, p.offer_id) || {}; rows.push([p.id, p.offer_id, o.supplier_name, (mat(o.material_id) || {}).fr, o.qty, p.received, p.price, p.total, p.cdate ?? '', p.cloc ?? '', SEED.T.fr['pay_status_' + p.pay]]); }); }
  else if (type === 'orders') { rows.push(['ID Commande', 'Client', 'Telephone', 'Wilaya', 'Commune', 'Adresse', 'Quantite', 'Sous-total (DA)', 'Frais Livraison (DA)', 'Total (DA)', 'Mode Paiement', 'Statut Paiement', 'Statut Commande', 'Date']); DB.orders.forEach(o => rows.push([o.id, o.name, o.phone, (wil(o.wilaya_id) || {}).fr, (mun(o.mun_id) || {}).fr, o.address, o.qty, o.subtotal, o.fee ?? '', o.total, o.method, SEED.T.fr['pay_status_' + o.pay_status], SEED.T.fr['order_status_' + o.status], o.created])); }
  else { rows.push(['ID', 'Type', 'ID Achat', 'ID Commande', 'Montant (DA)', 'Mode', 'Statut', 'Paye le', 'Date']); DB.tx.forEach(t => rows.push([t.id, t.type, t.purchase_id ?? '', t.order_id ?? '', t.amount, t.method ?? '', SEED.T.fr['pay_status_' + t.status] || t.status, t.paid_at ?? '', t.created])); }
  downloadFile('vivapot_' + type + '_' + date + '.csv', rows.map(csvLine).join('\n'));
}

/* ----- délégation d'événements ----- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-click]'); if (!el) return;
  touchSession(); const fn = CLICKS[el.dataset.click]; if (fn && ADMIN_CLICKS.includes(el.dataset.click) && !(ME && ME.role === 'admin')) return; if (fn) { if (el.tagName === 'A') e.preventDefault(); fn(el); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); touchSession();
  if (ADMIN_FORMS.includes(f.dataset.form) && !(ME && ME.role === 'admin')) return;
  if (['msg', 'profile', 'pw'].includes(f.dataset.form) && !ME) return;
  if ([...f.elements].some(x => x.type !== 'file' && x.type !== 'password' && String(x.value || '').length > 5000)) { alert(L('Texte trop long.', 'النص طويل جدا.')); return; }
  const fn = FORMS[f.dataset.form]; if (fn) fn(f);
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.wilaya) { const c = document.getElementById(t.dataset.wilaya); if (c) c.innerHTML = communeOpts(t.value, ''); const fi = $('#feeInfo'); if (fi) { const fee = DB.fees[t.value]; fi.textContent = fee != null ? L('Frais de livraison indicatifs : ', 'تكلفة التوصيل التقديرية: ') + money(fee) : ''; } }
  if (t.dataset && t.dataset.clickChange === 'selmat2') { SELL_MAT = +t.value; const keep = snapshotForm('offer'); render(); restoreForm('offer', keep); }
  if (t.dataset && t.dataset.change === 'photos') {
    const prev = $('#photoPrev'); prev.innerHTML = ''; const files = [...t.files];
    if (!checkFiles(files, 5)) { t.value = ''; return; }
    for (const f of files) { try { const u = await readImg(f, 300, 0.6); prev.insertAdjacentHTML('beforeend', `<img src="${u}" class="thumb-img" alt="">`); } catch (er) { } }
  }
  if (t.dataset && t.dataset.change === 'restore') {
    const file = t.files[0]; if (!file) return;
    try { if (!ME || ME.role !== 'admin') return; const d = JSON.parse(await file.text()); if (file.size > 20e6 || !Array.isArray(d.users) || !Array.isArray(d.products) || !Array.isArray(d.offers) || !d.users.some(u => u.role === 'admin')) throw 0; sanitizeDB(d); if (!confirm(L('Remplacer toutes les données actuelles ?', 'استبدال جميع البيانات الحالية؟'))) return; DB = d; save(); store.del(SES_KEY); flash('success', L('Données restaurées. Reconnectez-vous.', 'تمت استعادة البيانات. أعد تسجيل الدخول.')); go('#/connexion'); }
    catch (er) { alert(L('Fichier de sauvegarde invalide.', 'ملف النسخة الاحتياطية غير صالح.')); }
  }
});
document.addEventListener('input', e => {
  const box = e.target.closest('[data-calc]'); if (!box) return;
  const q = num(box.querySelector('[data-qty]').value) || 0, p = num(box.querySelector('[data-agreed]').value) || 0;
  box.querySelector('[data-total]').textContent = money(Math.round(q * p * 100) / 100);
});
window.addEventListener('hashchange', render);

(async function init() {
  await loadDB();
  render();
})();


</script></body></html>
